        /* ── Helpers ──────────────────────────────────────────────────────────── */
        function rrect(x, y, w, h, r) {
            if (typeof r === 'number') r = [r, r, r, r];
            const [tl, tr, br, bl] = r;
            ctx.beginPath();
            ctx.moveTo(x + tl, y); ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
            ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
            ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
            ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl); ctx.closePath();
        }

        /* ── Audio ────────────────────────────────────────────────────────────── */
        let ac;
        function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
        function beep(f, d, t = 'sine', v = .12, r) {
            try {
                const a = audio(), o = a.createOscillator(), g = a.createGain();
                o.connect(g); g.connect(a.destination); o.type = t; o.frequency.setValueAtTime(f, a.currentTime);
                if (r) o.frequency.exponentialRampToValueAtTime(r, a.currentTime + d);
                g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d);
                o.start(); o.stop(a.currentTime + d);
            } catch (e) { }
        }
        function playJump() { beep(280, .13, 'sine', .1, 580); }
        function playHit() { beep(180, .22, 'sawtooth', .15, 70); }
        function playWin() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .22, 'sine', .15), i * 80)); }
        function playLevelUp() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .14), i * 90)); }
        function playLose() { beep(350, .5, 'sawtooth', .18, 90); }
        function playUnlock() { beep(660, .1, 'sine', .08, 880); setTimeout(() => beep(880, .15, 'sine', .1, 1100), 100); }

        /* ── Levels ────────────────────────────────────────────────────────────── */
        const LEVELS = [

        const ALBUM_SIZE = 66;

        /* 10 fixed screen positions (5 levels × 2 reveals) */
        const ALBUM_POS = [
            /* lv 1  mid & end */
            { x: 8, y: 64, tilt: -6 },
            { x: 8, y: 158, tilt: 5 },
            /* lv 2 */
            { x: 726, y: 64, tilt: 6 },
            { x: 726, y: 158, tilt: -5 },
            /* lv 3 */

            /* lv 4 */

        const ALBUMS = [
            { band: 'AC/DC', title: 'Back in Black' },
            { band: 'Metallica', title: 'Master of Puppets' },
            { band: 'Megadeth', title: 'Peace Sells…' },
            { band: 'Slayer', title: 'Reign in Blood' },

        ];

        let revealedAlbums = [], nextAlbum = 0;
        let banners = [];

        function triggerAlbumReveal(idx) {
            if (idx >= ALBUM_POS.length) return;
            const pos = ALBUM_POS[idx];
            revealedAlbums.push({ idx, animY: pos.y - 100, phase: 'falling', af: 0 });
            banners.push({ text: ALBUMS[idx].band, sub: ALBUMS[idx].title, life: 200 });
            playUnlock();
            addFloat(pos.x + ALBUM_SIZE / 2, 260, '🎸 +POSTER', BR.gold);
        }

        function checkAlbumUnlocks() {
            if (state !== 'PLAYING') return;
            const milestones = [.50, .96];
            milestones.forEach((m, mi) => {
                const expected = (level - 1) * 2 + mi + 1;
                if (fillLevel >= m && nextAlbum < expected && nextAlbum < ALBUMS.length) {
                    nextAlbum++;
                    triggerAlbumReveal(nextAlbum - 1);
                }
            });
        }

        function updateRevealedAlbums() {
            revealedAlbums.forEach(ra => {
                const pos = ALBUM_POS[ra.idx];
                ra.af++;
                if (ra.phase === 'falling') {
                    ra.animY += (pos.y - ra.animY) * .13;
                    if (Math.abs(pos.y - ra.animY) < 1.2) { ra.animY = pos.y; ra.phase = 'wobbling'; ra.af = 0; }
                } else if (ra.phase === 'wobbling' && ra.af > 55) ra.phase = 'done';
            });
            for (let i = banners.length - 1; i >= 0; i--) { banners[i].life--; if (banners[i].life <= 0) banners.splice(i, 1); }
        }

        /* ── Album art drawings ──────────────────────────────────────────────── */
        function drawAlbumArt(idx, x, y, s) {

        /* ── Draw revealed poster frame ──────────────────────────────────────── */
        function drawRevealedPoster(ra) {
            const pos = ALBUM_POS[ra.idx], s = ALBUM_SIZE;
            const x = pos.x, cy = ra.phase === 'done' ? pos.y : ra.animY;
            const wobble = ra.phase === 'wobbling' ? pos.tilt * Math.sin(ra.af * .28) * (1 - ra.af / 56) : 0;
            const tilt = (pos.tilt + wobble) * Math.PI / 180;
            ctx.save();
            ctx.translate(x + s / 2, cy + s / 2); ctx.rotate(tilt);
            /* shadow */
            ctx.fillStyle = 'rgba(0,0,0,.55)'; rrect(-s / 2 + 4, -s / 2 + 5, s + 4, s + 6, 2); ctx.fill();
            /* frame */
            const fg = ctx.createLinearGradient(-s / 2 - 4, -s / 2 - 4, s / 2 + 4, s / 2 + 4);
            fg.addColorStop(0, '#2a1a08'); fg.addColorStop(.5, '#3c2a10'); fg.addColorStop(1, '#1a0c04');
            rrect(-s / 2 - 4, -s / 2 - 4, s + 8, s + 8, 4); ctx.fillStyle = fg; ctx.fill();
            ctx.strokeStyle = BR.gold; ctx.lineWidth = 1.3; ctx.stroke();
            /* art */
            drawAlbumArt(ra.idx, -s / 2, -s / 2, s);
            /* inner edge */
            ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; rrect(-s / 2, -s / 2, s, s, 1); ctx.stroke();
            /* bottom band label */
            ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(-s / 2, -s / 2 + s - 15, s, 15);
            ctx.font = `bold ${Math.round(s * .11)}px Impact,Arial`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(201,168,76,.95)';
            ctx.fillText(ALBUMS[ra.idx % 10].band, 0, -s / 2 + s - 4);
            /* pushpin */
            ctx.fillStyle = BR.red; ctx.beginPath(); ctx.arc(0, -s / 2 - 1, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = .7; ctx.stroke();
            ctx.fillStyle = 'rgba(255,150,150,.5)'; ctx.beginPath(); ctx.arc(-1, -s / 2 - 2, 1.5, 0, Math.PI * 2); ctx.fill();
            /* tape */
            ctx.globalAlpha = .5; ctx.fillStyle = 'rgba(255,245,200,.8)';
            ctx.save(); ctx.rotate(-.35); ctx.fillRect(-s * .42, -s * .55, s * .22, 7); ctx.restore();
            ctx.save(); ctx.rotate(.35); ctx.fillRect(s * .2, -s * .55, s * .22, 7); ctx.restore();
            ctx.globalAlpha = 1; ctx.restore();
        }

        function drawAllRevealedPosters() {
            revealedAlbums.forEach(ra => drawRevealedPoster(ra));
        }

        function drawBanners() {
            if (!banners.length) return;
            const bn = banners[banners.length - 1], maxL = 200;
            let alpha = 1;
            if (bn.life > maxL * .85) alpha = (maxL - bn.life) / (maxL * .15);
            else if (bn.life < 35) alpha = bn.life / 35;
            const bw = 202, bh = 48, bx = W - bw - 14, by = H - bh - 62;
            ctx.save(); ctx.globalAlpha = alpha * .92;
            ctx.fillStyle = 'rgba(10,3,0,.9)'; rrect(bx, by, bw, bh, 6); ctx.fill();
            ctx.strokeStyle = BR.gold; ctx.lineWidth = 1.2; rrect(bx, by, bw, bh, 6); ctx.stroke();
            ctx.font = '20px serif'; ctx.globalAlpha = alpha; ctx.fillText('💿', bx + 8, by + 32);
            ctx.font = `bold 12px Georgia`; ctx.fillStyle = BR.gold; ctx.textAlign = 'left'; ctx.fillText(bn.text, bx + 36, by + 18);
            ctx.font = '11px Georgia'; ctx.fillStyle = 'rgba(255,255,255,.88)';
            ctx.fillText((bn.sub.length > 22 ? bn.sub.slice(0, 21) + '…' : bn.sub), bx + 36, by + 35);
            ctx.textAlign = 'left'; ctx.restore();
        }

        /* ════════════════════════════════════════════════════════════════════════
           NEW OBSTACLES
           ════════════════════════════════════════════════════════════════════════ */
        function drawAmp(cx, y, w, h) {
            ctx.save();
            /* shadow */
            ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx, y + 4, w / 2 + 2, 5, 0, 0, Math.PI * 2); ctx.fill();
            /* body */
            const bg = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
            bg.addColorStop(0, '#111'); bg.addColorStop(.5, '#222'); bg.addColorStop(1, '#111');
            ctx.fillStyle = bg; rrect(cx - w / 2, y - h, w, h, [5, 5, 3, 3]); ctx.fill();
            /* top control panel */
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(cx - w / 2, y - h, w, h * .22);
            /* knobs */
            [cx - w * .3, cx, cx + w * .3].forEach(kx => {
                ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.arc(kx, y - h + h * .11, w * .09, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(kx, y - h + h * .11, w * .04, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(kx, y - h + h * .11); ctx.lineTo(kx + w * .06, y - h + h * .06); ctx.stroke();
            });
            /* grille cloth */
            ctx.fillStyle = '#131313'; rrect(cx - w / 2 + 4, y - h + h * .25, w - 8, h * .66, [2, 2, 2, 2]); ctx.fill();
            /* speaker cone rings */
            const spR = (w - 14) / 2;
            ctx.strokeStyle = 'rgba(55,55,55,.9)'; ctx.lineWidth = 1;
            for (let r = spR; r > 3; r -= 6) { ctx.beginPath(); ctx.arc(cx, y - h + h * .25 + spR + 4, r, 0, Math.PI * 2); ctx.stroke(); }
            ctx.fillStyle = '#1e1e1e'; ctx.beginPath(); ctx.arc(cx, y - h + h * .25 + spR + 4, spR * .24, 0, Math.PI * 2); ctx.fill();
            /* handle on top */
            ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(cx - w * .2, y - h); ctx.quadraticCurveTo(cx, y - h - 10, cx + w * .2, y - h); ctx.stroke();
            /* outline */

            /* shelves with bottles restored */
            const s1 = -(bgX * .22) % (W * 1.8); drawShelf(s1, 88, W * 1.8); drawShelf(s1 + W * 1.8, 88, W * 1.8);
            const s2 = -(bgX * .4) % (W * 1.5); drawShelf(s2, 178, W * 1.5, true); drawShelf(s2 + W * 1.5, 178, W * 1.5, true);
            /* rock icons */
            const icons = ['🤘', '🎸', '💀', '⚡', '🎵', '🤘', '🎸', '⚡'];
            ctx.font = '22px serif'; icons.forEach((ic, i) => { const ix = ((i * 142) - bgX * .3) % (W * 1.7) - 80; if (ix > -40 && ix < W + 40) { ctx.globalAlpha = .25; ctx.fillText(ic, ix, 215); ctx.globalAlpha = 1; } });
            /* ground counter */
            const gg = ctx.createLinearGradient(0, GY, 0, H); gg.addColorStop(0, '#7c4010'); gg.addColorStop(.06, '#8b4a18'); gg.addColorStop(.3, '#6b3610'); gg.addColorStop(1, '#3a1808'); ctx.fillStyle = gg; ctx.fillRect(0, GY, W, H - GY);
            ctx.fillStyle = '#b06030'; ctx.fillRect(0, GY, W, 3);
            ctx.fillStyle = 'rgba(226,75,74,.06)'; ctx.fillRect(0, GY, W, 1);
            ctx.fillStyle = 'rgba(255,200,100,.09)'; ctx.fillRect(0, GY + 1, W, 1);
            /* wood grain */
            ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1;
            for (let i = 0; i < 14; i++) { const gx = (-(bgX * .8) + i * 65) % W; ctx.beginPath(); ctx.moveTo(gx, GY + 4); ctx.lineTo(gx + 28, H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(gx + 35, GY + 4); ctx.lineTo(gx + 58, H); ctx.stroke(); }
            /* ── BARRACUDA neon sign on bar front ── */
            ctx.save();
            ctx.textAlign = 'center';
            const pulse = .75 + .25 * Math.sin(frame * .045);
            ctx.font = 'bold italic 21px Georgia';
            ctx.fillStyle = `rgba(226,75,74,${pulse})`;
            ctx.shadowColor = BR.red; ctx.shadowBlur = 18 * pulse;
            ctx.fillText('◆  B A R - R A C U D A  ◆', W / 2, GY + 22);
            ctx.shadowBlur = 7 * pulse; ctx.fillText('◆  B A R - R A C U D A  ◆', W / 2, GY + 22); ctx.shadowBlur = 0;
            ctx.font = '9px Georgia'; ctx.letterSpacing = '3px';
            ctx.fillStyle = `rgba(201,168,76,${pulse * .65})`;
            ctx.shadowColor = BR.gold; ctx.shadowBlur = 8 * pulse;
            ctx.fillText('C L Á S I C O S', W / 2, GY + 35); ctx.shadowBlur = 0;
            ctx.restore();
        }

        /* ── HUD ──────────────────────────────────────────────────────────────── */
        function drawHUD() {
            ctx.fillStyle = 'rgba(8,2,0,.76)'; rrect(10, 8, W - 20, 52, 8); ctx.fill();
            ctx.strokeStyle = 'rgba(226,75,74,.26)'; ctx.lineWidth = 1; rrect(10, 8, W - 20, 52, 8); ctx.stroke();
            ctx.font = 'bold 13px Georgia'; ctx.textAlign = 'left'; ctx.fillStyle = BR.gold; ctx.fillText(`NIVEL ${level}  ·  ${LEVELS[level - 1].label}`, 20, 32);
            ctx.font = 'bold 14px Georgia'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(`⭐ ${score}`, W / 2, 32);
            for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(W / 2 - 40 + i * 20, 48, 5, 0, Math.PI * 2); ctx.fillStyle = i + 1 < level ? BR.gold : i + 1 === level ? BR.red : 'rgba(201,168,76,.2)'; ctx.fill(); if (i + 1 === level) { ctx.strokeStyle = BR.red; ctx.lineWidth = 1.5; ctx.stroke(); } }
            ctx.font = 'bold 10px Georgia'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(201,168,76,.55)'; ctx.fillText(`💿 ${nextAlbum}/10`, W / 2, 50);
            const bw = 175, bh = 20, bx = W - bw - 22, by = 18;
            ctx.fillStyle = '#0f0400'; rrect(bx, by, bw, bh, 5); ctx.fill();
            if (fillLevel > .001) {
                const fg = ctx.createLinearGradient(bx, 0, bx + bw, 0); fg.addColorStop(0, '#b86e10'); fg.addColorStop(.5, '#f5a623'); fg.addColorStop(1, '#ffe066');
                ctx.fillStyle = fg; rrect(bx, by, bw * fillLevel, bh, [5, 5, fillLevel > .99 ? 5 : 1, fillLevel > .99 ? 5 : 1]); ctx.fill();
                if (fillLevel < .98) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(bx + bw * fillLevel - 6, by + bh / 2, 7, bh / 2 - 1, 0, 0, Math.PI * 2); ctx.fill(); }
                ctx.font = 'bold 11px Georgia'; ctx.textAlign = 'center'; ctx.fillStyle = fillLevel > .48 ? '#1a0800' : '#FFD700'; ctx.fillText(Math.round(fillLevel * 100) + '%', bx + bw * fillLevel / 2, by + bh - 4);
            }
            ctx.strokeStyle = BR.gold; ctx.lineWidth = 1.5; rrect(bx, by, bw, bh, 5); ctx.stroke();
            ctx.font = '22px serif'; ctx.textAlign = 'left'; ctx.fillText('🍺', bx - 30, by + bh);
            ctx.textAlign = 'left'; ctx.globalAlpha = 1;
        }

        /* ── Overlay ──────────────────────────────────────────────────────────── */
        function overlay(title, sub, hint, col, showLogo = false) {
            ctx.fillStyle = 'rgba(5,1,0,.84)'; ctx.fillRect(0, 0, W, H);
            if (showLogo) { ctx.save(); ctx.globalAlpha = .05; for (let i = 0; i < 3; i++)drawVinyl(W * (.15 + i * .35), H * .5, 55, vinylRot * (1 + i * .5)); ctx.restore(); }
            if (showLogo && logoImg.complete && logoImg.naturalWidth > 0) {
                const lr = 52, lx = W / 2, ly = H / 2 - 108;
                ctx.save(); ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.shadowColor = BR.red; ctx.shadowBlur = 28; ctx.strokeStyle = BR.red; ctx.lineWidth = 3; ctx.stroke(); ctx.clip(); ctx.drawImage(logoImg, lx - lr, ly - lr, lr * 2, lr * 2); ctx.restore();
                ctx.beginPath(); ctx.arc(W / 2, H / 2 - 108, lr + 5, 0, Math.PI * 2); ctx.strokeStyle = `rgba(201,168,76,${.4 + .28 * Math.sin(frame * .04)})`; ctx.lineWidth = 2; ctx.stroke();
            }
            const sc = .88 + .12 * Math.sin(frame * .06); const ty = showLogo ? H / 2 - 26 : H / 2 - 55;
            ctx.save(); ctx.translate(W / 2, ty); ctx.font = `bold ${Math.round(44 * sc)}px Georgia`; ctx.textAlign = 'center'; ctx.shadowColor = col; ctx.shadowBlur = 28; ctx.fillStyle = col; ctx.fillText(title, 0, 0); ctx.shadowBlur = 8; ctx.fillText(title, 0, 0); ctx.shadowBlur = 0; ctx.restore();
            if (sub) { ctx.font = '20px Georgia'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(sub, W / 2, showLogo ? H / 2 + 24 : H / 2 + 14); }
            ctx.globalAlpha = .5 + .5 * Math.sin(frame * .05); ctx.font = '14px Georgia'; ctx.fillStyle = BR.gold; ctx.textAlign = 'center'; ctx.fillText(hint, W / 2, showLogo ? H / 2 + 62 : H / 2 + 68); ctx.globalAlpha = 1; ctx.textAlign = 'left';
            if (showLogo) { ctx.font = 'bold 11px Georgia'; ctx.textAlign = 'center'; ctx.fillStyle = `rgba(201,168,76,${.3 + .1 * Math.sin(frame * .03)})`; ctx.fillText('◆  BAR-RACUDA CLÁSICOS  ◆', W / 2, H - 18); ctx.textAlign = 'left'; }
        }

        /* ── State / Init ─────────────────────────────────────────────────────── */
        let state = 'START', level = 1, fillLevel = 0, score = 0, frame = 0;
        function initLevel(lv) { level = lv; fillLevel = 0; obstacles = []; obsTimer = 0; particles = []; floats = []; P.reset(); banners = []; }
        function newGame() { score = 0; nextAlbum = 0; revealedAlbums = []; initLevel(1); }
        function onInput() {
            if (state === 'START') { state = 'PLAYING'; initLevel(1); }
            else if (state === 'PLAYING') { P.jump(); }
            else if (state === 'LEVEL_COMPLETE') { if (level < 5) { level++; state = 'PLAYING'; initLevel(level); } else state = 'WIN'; }
            else if (state === 'GAME_OVER') { state = 'PLAYING'; initLevel(level); }
            else if (state === 'WIN') { newGame(); state = 'START'; }
        }
        document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onInput(); } });
        canvas.addEventListener('click', onInput);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); onInput(); }, { passive: false });

        /* ── Collision ────────────────────────────────────────────────────────── */
        function collide() {
            const pb = P.bounds();
            for (const o of obstacles) {
                const ol = o.x - o.w / 2 + 4, or_ = o.x + o.w / 2 - 4, ot = o.y - o.h + 5, ob = o.y - 2;
                if (pb.x < or_ && pb.x + pb.w > ol && pb.y < ob && pb.y + pb.h > ot) { P.hit(); return; }
            }
        }

        /* ── GAME LOOP ────────────────────────────────────────────────────────── */
        function loop() {
            frame++; vinylRot += .008;
            ctx.clearRect(0, 0, W, H);

            /* z-order: far bg → shelves → revealed posters (over shelves) → gameplay → HUD */
            drawBgFar();
            drawBgNear();            /* shelves + ground + Barracuda sign */
            drawAllRevealedPosters(); /* album posters on top of shelves */

            if (state === 'PLAYING') {
                const cfg = LEVELS[level - 1];
                bgX += cfg.speed; obsTimer++;
                if (obsTimer >= cfg.interval) { spawn(); obsTimer = 0; }
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= cfg.speed;
                    if (obstacles[i].x < -80) { obstacles.splice(i, 1); score += 15; addFloat(P.x + P.w / 2, P.y - P.h - 15, '+15', '#7fff7f'); }
                }
                P.update(); collide();
                fillLevel += cfg.fillRate;
                checkAlbumUnlocks();
                if (fillLevel >= 1) { fillLevel = 1; state = 'LEVEL_COMPLETE'; spawnConfetti(W / 2, H / 2); score += 300 * level; if (level === 5) setTimeout(playWin, 50); else playLevelUp(); }
            }

            updateRevealedAlbums();

            obstacles.forEach(o => {
                if (o.type === 'bottle') drawBottle(o.x, o.y, o.w, o.h, o.tall);
                else if (o.type === 'barrel') drawBarrel(o.x, o.y, o.w, o.h);
                else if (o.type === 'amp') drawAmp(o.x, o.y, o.w, o.h);
                else if (o.type === 'guitar_obs') drawGuitarObs(o.x, o.y, o.w, o.h);
                else if (o.type === 'speaker') drawSpeaker(o.x, o.y, o.w, o.h);
            });

            if (state !== 'START') P.draw();
            updateParticles(); drawParticles();
            updateFloats(); drawFloats();
            drawBanners();
            drawHUD();

            if (state === 'START') overlay('🤘 BEER JUMP 🤘', '¡Llena la jarra saltando obstáculos!', 'ESPACIO · CLIC · TAP  para comenzar', BR.red, true);
            if (state === 'LEVEL_COMPLETE') overlay(`🍺 NIVEL ${level} COMPLETADO!`, '¡Jarra llena! ¡Salud! 🤘', level < 5 ? 'ESPACIO / TAP  →  Siguiente nivel' : 'ESPACIO / TAP  →  Último nivel', BR.gold, false);
            if (state === 'GAME_OVER') overlay('💧 ¡DERRAMASTE!', 'La jarra se vació… reinténtalo', 'ESPACIO / TAP  para reintentar', '#FF5555', false);
            if (state === 'WIN') overlay('🏆 ¡CAMPEÓN DEL BAR! 🏆', `¡Todos los niveles superados!  ⭐ ${score} pts`, 'ESPACIO / TAP  para jugar de nuevo', BR.gold, true);

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
