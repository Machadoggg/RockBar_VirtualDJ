<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Fichar — Rockbar</title>
<link rel="stylesheet" href="/style.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    transition: background 0.3s ease;
  }

  /* Fondo de toda la pantalla cambia segun el resultado — feedback
     imposible de no ver, ideal para un kiosco donde el empleado
     ficha rapido y sigue con lo suyo. */
  body.state-ok    { background: radial-gradient(circle at 50% 20%, rgba(76,175,80,0.16), var(--bg, #0b0a0c) 70%); }
  body.state-out   { background: radial-gradient(circle at 50% 20%, rgba(232,178,61,0.16), var(--bg, #0b0a0c) 70%); }
  body.state-error { background: radial-gradient(circle at 50% 20%, rgba(200,30,58,0.18), var(--bg, #0b0a0c) 70%); }

  main {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  /* ---------- Encabezado ---------- */
  .kiosk-header { margin-bottom: 22px; }
  .kiosk-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--bg-card, #161110);
    border: 1px solid var(--border, #332821);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem;
    margin: 0 auto 14px;
  }
  .kiosk-header h1 {
    font-size: 1.35rem;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .kiosk-header p {
    margin: 0;
    color: var(--text-dim, #9a8d83);
    font-size: 0.88rem;
  }

  /* ---------- Display del PIN ---------- */
  .pin-display {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 26px 0 22px;
  }
  .pin-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border, #332821);
    background: transparent;
    transition: all 0.15s ease;
  }
  .pin-dot.filled {
    background: var(--red, #c81e3a);
    border-color: var(--red, #c81e3a);
    transform: scale(1.1);
  }
  .pin-display.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ---------- Teclado ---------- */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .keypad button {
    font-size: 1.6rem;
    font-weight: 600;
    padding: 20px 0;
    border-radius: 16px;
    border: 1px solid var(--border, #332821);
    background: var(--bg-card, #161110);
    color: var(--text, #ede6da);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .keypad button:active { transform: scale(0.94); background: rgba(255,255,255,0.06); }
  .keypad button:disabled { opacity: 0.4; cursor: default; }
  .keypad button:disabled:active { transform: none; }

  .keypad button.borrar-key {
    background: transparent;
    border-color: transparent;
    color: var(--text-dim, #9a8d83);
    font-size: 1.3rem;
  }
  .keypad button.ok-key {
    background: var(--red, #c81e3a);
    border-color: var(--red, #c81e3a);
    color: #fff;
  }
  .keypad button.ok-key:disabled { background: var(--red, #c81e3a); opacity: 0.5; }

  /* ---------- Spinner mientras carga ---------- */
  .ok-key .spinner {
    width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .ok-key.loading .spinner { display: block; }
  .ok-key.loading .ok-label { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Resultado ---------- */
  .result-box {
    margin-top: 22px;
    min-height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-card {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.25s ease;
  }
  .result-card.visible { opacity: 1; transform: translateY(0); }
  .result-card.entrada { background: rgba(76,175,80,0.14); color: #7cd487; border: 1px solid rgba(76,175,80,0.35); }
  .result-card.salida  { background: rgba(232,178,61,0.14); color: #f0c674; border: 1px solid rgba(232,178,61,0.35); }
  .result-card.error   { background: rgba(200,30,58,0.14); color: #ef7d92; border: 1px solid rgba(200,30,58,0.35); }

  .result-card .r-title { display: block; font-size: 1.05rem; margin-bottom: 2px; }
  .result-card .r-sub { display: block; font-size: 0.82rem; font-weight: 400; opacity: 0.85; }
</style>
</head>
<body>
  <main>
    <div class="kiosk-header">
      <div class="kiosk-icon">🕐</div>
      <h1>Control de asistencia</h1>
      <p>Ingresa tu PIN de 4 digitos para fichar</p>
    </div>

    <div class="pin-display" id="pinDisplay">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="keypad" id="keypad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="borrar" class="borrar-key">⌫</button>
      <button data-key="0">0</button>
      <button data-key="ok" class="ok-key" id="okBtn">
        <span class="ok-label">✓</span>
        <span class="spinner"></span>
      </button>
    </div>

    <div class="result-box">
      <div id="resultCard" class="result-card"></div>
    </div>
  </main>

  <script>
    const pinDisplay = document.getElementById('pinDisplay');
    const pinDots = pinDisplay.querySelectorAll('.pin-dot');
    const resultCard = document.getElementById('resultCard');
    const keypad = document.getElementById('keypad');
    const okBtn = document.getElementById('okBtn');

    let pin = '';
    let submitting = false;
    let hideResultTimer = null;

    function renderPin() {
      pinDots.forEach((dot, i) => dot.classList.toggle('filled', i < pin.length));
    }

    function setKeypadEnabled(enabled) {
      keypad.querySelectorAll('button').forEach((b) => { b.disabled = !enabled; });
    }

    function shakePin() {
      pinDisplay.classList.remove('shake');
      // forzar reflow para poder re-disparar la animacion
      void pinDisplay.offsetWidth;
      pinDisplay.classList.add('shake');
    }

    function showResult(type, title, sub) {
      clearTimeout(hideResultTimer);
      document.body.className = 'state-' + (type === 'entrada' ? 'ok' : type === 'salida' ? 'out' : 'error');
      resultCard.className = 'result-card visible ' + type;
      resultCard.innerHTML = `<span class="r-title">${title}</span><span class="r-sub">${sub}</span>`;

      hideResultTimer = setTimeout(() => {
        resultCard.classList.remove('visible');
        document.body.className = '';
      }, 4000);
    }

    async function submitPin() {
      if (pin.length !== 4 || submitting) return;
      submitting = true;
      setKeypadEnabled(false);
      okBtn.classList.add('loading');

      try {
        const res = await fetch('/api/staff/clock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();

        if (!data.ok) {
          shakePin();
          showResult('error', 'PIN no valido', data.message || 'No se pudo fichar. Intenta de nuevo.');
        } else if (data.tipo === 'entrada') {
          showResult('entrada', `Bienvenido, ${data.empleado} 👋`, 'Entrada registrada correctamente.');
        } else {
          showResult('salida', `Hasta luego, ${data.empleado} 👋`, 'Salida registrada correctamente.');
        }
      } catch (err) {
        shakePin();
        showResult('error', 'Sin conexion', 'No se pudo comunicar con el servidor.');
      }

      pin = '';
      renderPin();
      okBtn.classList.remove('loading');
      setKeypadEnabled(true);
      submitting = false;
    }

    keypad.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        if (submitting) return;

        if (key === 'borrar') {
          pin = pin.slice(0, -1);
          renderPin();
        } else if (key === 'ok') {
          submitPin();
        } else if (pin.length < 4) {
          pin += key;
          renderPin();
          if (pin.length === 4) submitPin();
        }
      });
    });

    renderPin();
  </script>
</body>
</html>
